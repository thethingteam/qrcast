name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Opens or updates the release PR. Merging that PR creates the tag and the
      # GitHub release. PRs opened with GITHUB_TOKEN do not trigger CI; the
      # release PR only changes the version and CHANGELOG, and the publish job
      # below runs the build and tests again before it publishes.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and the provenance attestation. There is
      # no npm token anywhere in this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      # Node 24 ships an npm new enough (11.5.1 or later) for trusted publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Type checks, unit tests and the packed-tarball check.
      - run: pnpm test
      - run: npm publish --provenance --access public
        working-directory: packages/qrcast
